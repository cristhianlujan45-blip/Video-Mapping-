<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>LumaMap Remote</title>
<style>
  body{background:#14171c;color:#dfe6f0;font:15px system-ui;margin:0;min-height:100vh;
       display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px;}
  h1{font-size:20px;color:#4fc3f7;margin:0;}
  #net{color:#8b98ab;font-size:12px;}
  #state{background:#1c2129;border:1px solid #2e3745;border-radius:8px;padding:10px 16px;
         font-size:14px;min-width:260px;text-align:center;}
  .grid{display:grid;grid-template-columns:repeat(3,88px);gap:10px;}
  button{background:#242b36;color:#dfe6f0;border:1px solid #2e3745;border-radius:10px;
         font-size:24px;height:64px;cursor:pointer;}
  button:active{background:#4fc3f7;color:#000;}
  input[type=range]{width:260px;}
  .lbl{font-size:12px;color:#8b98ab;}
</style>
</head>
<body>
<h1>◩ LumaMap Remote</h1>
<div id="net">conectando…</div>
<div id="state">—</div>
<div class="grid">
  <button data-c="prev">⏮</button>
  <button data-c="play">▶</button>
  <button data-c="next">⏭</button>
  <button data-c="pause">⏸</button>
  <button data-c="stop">⏹</button>
  <button data-c="brightness" data-v="1">☀</button>
</div>
<div><span class="lbl">Brillo master</span><input id="bri" type="range" min="0" max="1" step="0.01" value="1"></div>
<script type="module">
import { Remote } from "/js/remote.js";
const netEl = document.getElementById("net"), stateEl = document.getElementById("state");
const remote = new Remote({
  role: "controller", name: "Mando " + Math.floor(Math.random() * 1000),
  onStatus: s => netEl.textContent = s,
  onState: st => {
    stateEl.innerHTML = `<b>${st.project}</b><br>Escena ${st.sceneIndex+1}/${st.sceneCount}: ${st.scene}<br>` +
      `${st.playing ? "▶ reproduciendo" : "⏸ detenido"} · ${st.fps} FPS · ${st.resolution}`;
  },
});
remote.connect();
document.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () =>
  remote.sendControl(b.dataset.c, b.dataset.v !== undefined ? Number(b.dataset.v) : undefined)));
document.getElementById("bri").addEventListener("input", e =>
  remote.sendControl("brightness", Number(e.target.value)));
</script>
</body>
</html>
