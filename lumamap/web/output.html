<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>LumaMap · Salida</title>
<style>
  html,body{height:100%;margin:0;background:#000;overflow:hidden;cursor:none;}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;}
  #ov{pointer-events:none;}
  #hud{position:fixed;left:50%;top:16px;transform:translateX(-50%);color:#e6f6ff;font:600 14px system-ui,sans-serif;
       background:rgba(0,0,0,.65);border:1px solid #00e5ff55;padding:10px 16px;border-radius:12px;text-align:center;
       transition:opacity .4s;cursor:default;z-index:5}
  #hud.hide{opacity:0;pointer-events:none}
  #hud button{margin-top:8px;font:600 14px system-ui;background:#00e5ff;color:#001018;border:0;border-radius:8px;padding:8px 14px}
</style>
</head>
<body>
<canvas id="out"></canvas>
<canvas id="ov"></canvas>
<div id="hud">LumaMap · Salida<br><small>Esperando al editor…</small><br><button id="fs">Pantalla completa</button></div>
<script type="module" src="js/output.js"></script>
</body>
</html>
