<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0d0f12" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>LUJAN Remote</title>
    <style>
      :root { --bg: #0d0f12; --bg2: #161a20; --bg3: #20252d; --line: #2e3540; --fg: #e8ebf0; --fg2: #9aa3b0; --accent: #19c3ff; --live: #ff3b3b; --ok: #33d17a; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.3 system-ui, 'Segoe UI', Roboto, sans-serif; touch-action: manipulation; }
      header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--bg2); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
      header b { color: var(--accent); }
      .tc { font-family: ui-monospace, Consolas, monospace; margin-left: auto; color: var(--fg2); }
      main { padding: 12px; display: flex; flex-direction: column; gap: 14px; max-width: 900px; margin: 0 auto; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg2); margin: 0 0 8px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button { flex: 1; min-width: 70px; height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg3); color: var(--fg); font-size: 15px; font-weight: 600; }
      button:active { transform: scale(.97); }
      button.primary { background: #0b8fc0; border-color: var(--accent); }
      button.blackout { background: #2a0f12; border-color: var(--live); color: #ff8a95; height: 64px; letter-spacing: .1em; }
      button.blackout.on { background: var(--live); color: #fff; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
      .grid button.active { border-color: var(--live); box-shadow: inset 0 0 0 2px var(--live); }
      .grid button.preview { border-color: var(--ok); }
      .fader { position: relative; height: 54px; border-radius: 10px; background: var(--bg3); border: 1px solid var(--line); overflow: hidden; touch-action: none; }
      .fader .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #0b8fc0, #19c3ff); opacity: .8; }
      .fader span { position: absolute; left: 12px; top: 16px; font-weight: 600; text-shadow: 0 0 4px #000; }
      .fader em { position: absolute; right: 12px; top: 16px; font-style: normal; font-family: ui-monospace, monospace; }
      #login { display: flex; flex-direction: column; gap: 12px; padding: 30px 16px; max-width: 360px; margin: 0 auto; }
      input { height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); color: var(--fg); font-size: 24px; text-align: center; letter-spacing: .3em; }
      .err { color: #ff6b78; text-align: center; min-height: 20px; }
      .status { font-size: 12px; color: var(--fg2); }
    </style>
  </head>
  <body>
    <header><b>LUJAN</b> Remote <span id="show" class="status"></span><span id="tc" class="tc">--:--:--:--</span></header>
    <section id="login">
      <p>Introduce el PIN que aparece en LUJAN MAPPING Studio → Remoto.</p>
      <input id="pin" inputmode="numeric" autocomplete="off" maxlength="8" />
      <button id="go" class="primary">Conectar</button>
      <div id="err" class="err"></div>
    </section>
    <main id="app" hidden>
      <div class="row">
        <button data-t="previous">◀◀</button>
        <button data-t="play" class="primary">▶</button>
        <button data-t="pause">❚❚</button>
        <button data-t="stop">■</button>
        <button data-t="next">▶▶</button>
      </div>
      <div class="row"><button id="take" class="primary">TAKE</button></div>
      <section><h2>Escenas</h2><div id="scenes" class="grid"></div></section>
      <section id="cuesec" hidden><h2>Cues</h2><div id="cues" class="grid"></div></section>
      <section><h2>Controles</h2><div id="faders" style="display:flex;flex-direction:column;gap:8px"></div></section>
      <button id="blackout" class="blackout">BLACKOUT</button>
      <div id="conn" class="status"></div>
    </main>
    <script src="./remote.js"></script>
  </body>
</html>
