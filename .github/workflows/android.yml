name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: gradle/actions/setup-gradle@v4

      - name: LumaMap tests (motor, modelo, servidor)
        working-directory: lumamap
        run: npm test

      - name: Unit tests (core + app)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew --no-daemon :app:assembleDebug :lumamap:assembleDebug

      - name: Upload LUJAN MAPPING debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lujan-mapping-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload LumaMap debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumamap-debug-apk
          path: lumamap/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package LumaMap for Windows (portable zip)
        working-directory: lumamap/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run dist:win

      - name: Upload LumaMap Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: lumamap-windows-x64
          path: lumamap/desktop/dist/*.zip
          if-no-files-found: error
