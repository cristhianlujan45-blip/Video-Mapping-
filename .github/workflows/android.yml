name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Número de compilación: versión 2.3.N (Android versionCode 1000+N). El
  # actualizador de la app compara este número con el publicado.
  LUMAMAP_BUILD: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: gradle/actions/setup-gradle@v4

      # OpenGL por software (OSMesa): las pruebas de plugins FFGL dibujan de verdad.
      - name: OpenGL por software para las pruebas FFGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libosmesa6

      - name: LumaMap tests (motor, modelo, audio, servidor)
        working-directory: lumamap
        run: npm test

      - name: Unit tests (core + app)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :lumamap:assembleRelease

      - name: Upload LUJAN MAPPING debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lujan-mapping-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload LumaMap APK
        uses: actions/upload-artifact@v4
        with:
          name: lumamap-android
          path: lumamap/android/build/outputs/apk/release/lumamap-release.apk
          if-no-files-found: error

  # Pruebas de extremo a extremo: navegador (Chromium) y app de escritorio real
  # (Electron) con red de verdad: Art-Net, sACN, búsqueda de nodos, entrada DMX.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # WebSocket global (prueba del mando remoto)
      - name: Instalar Electron y Playwright
        working-directory: lumamap
        run: |
          (cd desktop && npm ci --no-audit --no-fund)
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      # Cada paso se ejecuta aunque falle el anterior: así se ve todo lo que falla de una vez.
      # La batería del navegador en dos tandas, cada una con su navegador limpio (en un solo
      # navegador de 35 minutos la máquina de la CI se satura y las últimas pruebas fallan por tiempo).
      - name: Pruebas en el navegador (1/2)
        working-directory: lumamap
        env:
          SHOTS_DIR: ${{ runner.temp }}/shots
          PART: "1"
        run: node tests/browser.test.js
      - name: Pruebas en el navegador (2/2 · móviles, plugins, VJ y lo de Resolume)
        if: success() || failure()
        working-directory: lumamap
        env:
          SHOTS_DIR: ${{ runner.temp }}/shots
          PART: "2"
        run: node tests/browser.test.js
      - name: Todos los efectos, estilos y animaciones (GPU por software)
        if: success() || failure()
        working-directory: lumamap
        run: node tests/effects.browser.test.js
      - name: Tracking real (cámara falsa con una persona → IA → regla)
        if: success() || failure()
        working-directory: lumamap
        run: node tests/tracking.browser.test.js
      - name: Pruebas de velocidad (móvil con CPU ×4, como la APK)
        if: success() || failure()
        working-directory: lumamap
        run: node tests/perf.test.js
      - name: Pruebas de la app de escritorio (Electron + red)
        if: success() || failure()
        working-directory: lumamap
        run: xvfb-run -a node tests/desktop.e2e.mjs
      - name: Capturas de las pruebas que fallaron
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-pruebas-fallidas
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build LumaMap Windows installer
        working-directory: lumamap/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci --no-audit --no-fund
          npm version "2.3.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          npm run installer:win

      # Plugins FFGL de Resolume: el anfitrión de Windows de verdad (el que va en el instalador)
      # con plugins FFGL compilados aquí; sin tarjeta gráfica, con el OpenGL por software de Mesa.
      - name: Plugins FFGL de Resolume (anfitrión real de Windows)
        working-directory: lumamap
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Headers @{ "User-Agent" = "lumamap-ci" } https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -like "*release-msvc.7z" } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile mesa.7z
          7z x mesa.7z -omesa | Out-Null
          $env:FFGL_GL_DIR = (Resolve-Path mesa\x64).Path
          node tests/ffgl.test.js

      # Prueba real del ciclo de vida: instalar, abrir, actualizar con la app
      # abierta, rollback, volver a la anterior, reparar, desinstalar (conserva
      # datos) y reinstalar.
      - name: Instalar, actualizar, rollback, reparar, desinstalar y reinstalar
        shell: pwsh
        working-directory: lumamap/desktop
        run: ./test-install.ps1

      - name: Capturas del instalador (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-instalador
          path: ${{ runner.temp }}/capturas-instalador
          if-no-files-found: ignore

      - name: Upload LumaMap Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: lumamap-windows-installer
          path: lumamap/desktop/dist/LumaMap-Setup*.exe
          if-no-files-found: error

  # Descarga directa (sin zips): publica el instalador y el APK en una versión
  # preliminar «lumamap-latest» de la página Releases del repositorio.
  # Mac: imagen .dmg para Apple Silicon (M1/M2/M3/M4) y otra para Intel. Firma ad hoc (sin
  # certificado de Apple). Se abre la app de verdad y se espera a que el editor arranque.
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build LumaMap para Mac (Apple Silicon e Intel)
        working-directory: lumamap/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci --no-audit --no-fund
          npm version "2.3.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          node build.mjs installer-mac arm64
          node build.mjs installer-mac x64
          ls -la dist/*.dmg

      - name: Abrir la app del Mac y comprobar que arranca
        working-directory: lumamap/desktop
        run: |
          MNT=$(mktemp -d)
          hdiutil attach dist/LumaMap-Mac-arm64.dmg -nobrowse -mountpoint "$MNT"
          cp -R "$MNT/LumaMap.app" "$RUNNER_TEMP/"
          hdiutil detach "$MNT"
          codesign --verify --deep --verbose=2 "$RUNNER_TEMP/LumaMap.app"
          DATA=$(mktemp -d)
          LUMAMAP_USER_DATA="$DATA" "$RUNNER_TEMP/LumaMap.app/Contents/MacOS/LumaMap" > "$RUNNER_TEMP/mac-app.log" 2>&1 &
          PID=$!
          for i in $(seq 1 60); do grep -q "Editor listo" "$DATA/logs/lumamap.log" 2>/dev/null && break; sleep 2; done
          cat "$DATA/logs/lumamap.log" || true
          kill $PID 2>/dev/null || true
          grep -q "Editor listo" "$DATA/logs/lumamap.log"

      - name: Upload LumaMap Mac
        uses: actions/upload-artifact@v4
        with:
          name: lumamap-mac
          path: lumamap/desktop/dist/*.dmg
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build, windows, mac, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Rename downloads
        run: |
          mkdir release
          cp out/lumamap-windows-installer/*.exe release/LumaMap-Setup.exe
          cp out/lumamap-android/lumamap-release.apk release/LumaMap-Android.apk
          cp out/lujan-mapping-debug-apk/*.apk release/LujanMapping-Android.apk
          cp out/lumamap-mac/LumaMap-Mac-arm64.dmg release/LumaMap-Mac-AppleSilicon.dmg
          cp out/lumamap-mac/LumaMap-Mac-x64.dmg release/LumaMap-Mac-Intel.dmg
          BASE="https://github.com/${{ github.repository }}/releases/download/lumamap-latest"
          NOTES=$(echo "${{ github.event.head_commit.message }}" | head -n1 | sed 's/"/\\"/g')
          SHA=$(sha256sum release/LumaMap-Setup.exe | cut -d' ' -f1)
          SIZE=$(stat -c%s release/LumaMap-Setup.exe)
          cat > release/version.json <<JSON
          {
            "version": "2.3.${LUMAMAP_BUILD}",
            "build": ${LUMAMAP_BUILD},
            "commit": "${{ github.sha }}",
            "notes": "${NOTES}",
            "android": { "versionCode": $((1000 + LUMAMAP_BUILD)), "url": "${BASE}/LumaMap-Android.apk" },
            "windows": { "version": "2.3.${LUMAMAP_BUILD}", "url": "${BASE}/LumaMap-Setup.exe", "sha256": "${SHA}", "size": ${SIZE} },
            "mac": { "version": "2.3.${LUMAMAP_BUILD}", "arm64": "${BASE}/LumaMap-Mac-AppleSilicon.dmg", "x64": "${BASE}/LumaMap-Mac-Intel.dmg" }
          }
          JSON
          cat release/version.json
          python3 -c "import json;json.load(open('release/version.json'))"
          ls -la release
      # La etiqueta debe apuntar al commit que se compila (si no, el código fuente
      # de la página de la versión no coincide con los instaladores) y no deben
      # quedar instaladores viejos con otro nombre.
      - name: Mover la etiqueta y limpiar archivos antiguos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/lumamap-latest" -f sha="${GITHUB_SHA}" -F force=true || true
          for a in $(gh release view lumamap-latest --json assets -q '.assets[].name' 2>/dev/null); do
            case "$a" in LumaMap-Setup.exe|LumaMap-Android.apk|LujanMapping-Android.apk|LumaMap-Mac-AppleSilicon.dmg|LumaMap-Mac-Intel.dmg|version.json) ;; *) gh release delete-asset lumamap-latest "$a" -y || true ;; esac
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: lumamap-latest
          name: LumaMap (última versión)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Última compilación de LumaMap desde la rama `${{ github.ref_name }}` (commit ${{ github.sha }}).

            Versión **2.3.${{ github.run_number }}**. La app avisa sola de las versiones nuevas (Menú → Buscar actualizaciones).

            - **Windows:** descarga `LumaMap-Setup.exe`, ábrelo e instala (si aparece «Windows protegió su PC»: *Más información → Ejecutar de todas formas*).
            - **Android (2 apps):** `LumaMap-Android.apk` (la app completa) y `LujanMapping-Android.apk` (LUJAN MAPPING). Descárgalas e instálalas (permite «instalar apps desconocidas»).
            - **Mac:** `LumaMap-Mac-AppleSilicon.dmg` (M1, M2, M3, M4) o `LumaMap-Mac-Intel.dmg`. Ábrelo y arrastra LumaMap a Aplicaciones. La primera vez: clic derecho sobre LumaMap → *Abrir* → *Abrir* (no está firmada con un certificado de Apple). Los plugins FFGL (.dll) son solo de Windows.
          files: release/*
          fail_on_unmatched_files: true
